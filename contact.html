<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="contact">
<meta property="og:description" content="Get in touch with me.">
<meta property="og:image" content="assets/logo.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="assets/logo.png">
<link rel="icon" type="image/png" href="assets/logo.png">
<title>contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060608;
  --panel:#0b0d12;
  --panel-border:#1c2530;
  --blue:#4fb2ff;
  --blue-bright:#7fd0ff;
  --blue-dim:#1c5b8c;
  --glow:0 0 18px rgba(79,178,255,0.55), 0 0 40px rgba(79,178,255,0.25);
  --text:#d9e4ee;
  --text-dim:#5c6b7a;
  --mono: 'JetBrains Mono', monospace;
  --pixel: 'Press Start 2P', monospace;
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:var(--mono); overflow-x:hidden; min-height:100%;
}
body{ position:relative; }
body::before{
  content:""; position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(79,178,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,178,255,0.035) 1px, transparent 1px);
  background-size:38px 38px; pointer-events:none; z-index:0;
  animation: gridDrift 40s linear infinite;
}
@keyframes gridDrift{ from{ background-position:0 0, 0 0; } to{ background-position:0 400px, 400px 0; } }
body::after{
  content:""; position:fixed; inset:0;
  background:radial-gradient(ellipse at 50% 20%, rgba(79,178,255,0.10), transparent 60%);
  pointer-events:none; z-index:0;
}
.wrap{
  position:relative; z-index:1; max-width:640px; margin:0 auto;
  padding:56px 24px 80px; display:flex; flex-direction:column; align-items:center;
}

.nav{
  display:flex; flex-wrap:wrap; gap:22px;
  opacity:0; transform:translateY(-6px);
  animation: navIn 0.6s ease forwards; animation-delay:0.1s;
}
@keyframes navIn{ to{ opacity:1; transform:translateY(0); } }
.nav a{
  font-size:12px; letter-spacing:1.5px; color:var(--text-dim); text-decoration:none;
  padding-bottom:4px; position:relative; transition:color 0.2s ease;
}
.nav a:hover{ color:var(--blue-bright); }
.nav a.active{ color:var(--blue-bright); }
.nav a.active::after{
  content:""; position:absolute; left:0; right:0; bottom:-4px; height:1px;
  background:var(--blue); box-shadow:0 0 6px rgba(79,178,255,0.6);
}
@media (max-width:480px){ .nav{ gap:14px; } .nav a{ font-size:11px; } }

.page-title{
  margin-top:34px; font-family:var(--pixel); font-size:clamp(22px,5vw,32px);
  color:#fff; text-shadow: 0 0 6px rgba(79,178,255,0.9), 0 0 22px rgba(79,178,255,0.65);
  letter-spacing:1px; opacity:0; animation: fadeUp 0.7s ease forwards; animation-delay:0.3s;
}
.page-sub{
  margin-top:14px; font-size:13px; line-height:1.7; color:#8fa0b0; text-align:center; max-width:460px;
  opacity:0; animation: fadeUp 0.7s ease forwards; animation-delay:0.45s;
}
.page-sub .slash{ color:var(--blue); }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

.section-label{
  width:100%; display:flex; align-items:center; gap:10px;
  margin-top:40px; margin-bottom:16px; font-size:11px; letter-spacing:3px; color:#3a4856;
  opacity:0; animation: fadeUp 0.7s ease forwards; animation-delay:0.6s;
}
.section-label .line{ flex:1; height:1px; background:linear-gradient(90deg, var(--panel-border), transparent); }

.status-box{
  margin-top:10px; width:100%; border:1px solid var(--panel-border);
  background:rgba(8,10,14,0.85); border-radius:8px; padding:16px 18px;
  font-size:12px; line-height:2;
  opacity:0; animation: fadeUp 0.6s ease forwards; animation-delay:0.75s;
}
.status-row{ display:flex; justify-content:space-between; }
.status-key{ color:var(--text-dim); letter-spacing:1px; }
.status-val{ color:var(--blue-bright); }
.status-val.ok{ color:#4fffb0; }
.status-val .blinker{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:#4fffb0; margin-right:6px; animation:pulse 1.6s ease-in-out infinite;
  box-shadow:0 0 8px rgba(79,255,176,0.7);
}
@keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.5; transform:scale(0.8); } }

.contact-form{ width:100%; display:flex; flex-direction:column; gap:16px; margin-top:10px; }
.form-field{
  display:flex; flex-direction:column; gap:6px;
  opacity:0; transform:translateY(14px); animation:cardIn 0.5s ease forwards;
}
.form-field:nth-child(1){ animation-delay: 0.9s; }
.form-field:nth-child(2){ animation-delay: 1.0s; }
.form-field:nth-child(3){ animation-delay: 1.1s; }
@keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }
.form-field label{ font-size:11px; letter-spacing:1px; color:var(--blue-bright); font-weight:700; }
.form-field input, .form-field select, .form-field textarea{
  background:rgba(10,13,18,0.8); border:1px solid var(--panel-border); border-radius:6px;
  padding:10px 12px; color:var(--text); font-family:var(--mono); font-size:12px;
  transition:border-color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus{
  outline:none; border-color:var(--blue); box-shadow:0 0 0 1px var(--blue), 0 0 16px rgba(79,178,255,0.3);
  transform:translateY(-1px);
}
.form-field textarea{ min-height:100px; resize:vertical; }
.field-hint{ font-size:10px; color:var(--text-dim); }
.contact-form button{
  background:transparent; border:1px solid var(--blue-dim); color:var(--blue-bright);
  border-radius:6px; padding:12px; font-family:var(--mono); font-weight:700; cursor:pointer;
  opacity:0; transform:translateY(14px); animation: cardIn 0.5s ease forwards; animation-delay: 1.2s;
}
.contact-form button:hover{ border-color:var(--blue); box-shadow:0 0 16px rgba(79,178,255,0.3); transform:translateY(-2px); }
.contact-form button:active{ transform:translateY(0); }

.other-ways{
  margin-top:36px; width:100%; text-align:center; font-size:11px; color:var(--text-dim);
  opacity:0; animation: fadeUp 0.7s ease forwards; animation-delay:1.3s;
}
.other-ways a{ color:var(--blue-bright); text-decoration:underline; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition:none !important; }
}
</style>
</head>
<body>
<div class="wrap">

  <nav class="nav">
    <a href="/">HOME</a>
    <a href="/faq.html">FAQ</a>
    <a href="/changelog.html">CHANGELOG</a>
    <a href="/writing">BLOGS</a>
    <a href="/contact.html" class="active">CONTACT</a>
    <a href="/resume.html">RESUME</a>
  </nav>

  <div class="page-title">GET IN TOUCH</div>
  <div class="page-sub"><span class="slash">//</span> tell me what you need built and I'll get back to you.</div>

  <div class="section-label"><span>AVAILABILITY</span><span class="line"></span></div>

  <div class="status-box">
    <div class="status-row">
      <span class="status-key">STATUS</span>
      <span class="status-val ok"><span class="blinker"></span>AVAILABLE FOR WORK</span>
    </div>
    <div class="status-row">
      <span class="status-key">RESPONSE TIME</span>
      <span class="status-val">~24 HRS</span>
    </div>
  </div>

  <div class="section-label"><span>PROJECT DETAILS</span><span class="line"></span></div>

  <form action="https://formspree.io/f/xpqvoyel" method="POST" class="contact-form">
    <div class="form-field">
      <label for="emailField">Your email</label>
      <input type="email" id="emailField" name="email" placeholder="you@example.com" required>
      <span class="field-hint">so I can reply to you</span>
    </div>
    <div class="form-field">
      <label for="typeField">Project type</label>
      <select id="typeField" name="project_type">
        <option value="Small script / automation">Small script / automation — £25</option>
        <option value="Discord bot">Discord bot — £50</option>
        <option value="Full website">Full website — £150</option>
        <option value="Other / not sure">Other / not sure</option>
      </select>
    </div>
    <div class="form-field">
      <label for="messageField">What do you need built?</label>
      <textarea id="messageField" name="message" placeholder="describe the project — a bot, a script, a full site, etc." required></textarea>
    </div>
    <button type="submit">SEND &#8594;</button>
  </form>

  <div class="other-ways">
    <span class="slash">//</span> or reach out directly at <a href="mailto:echojxmes@gmail.com">echojxmes@gmail.com</a>
  </div>

</div>
</body>
</html>
