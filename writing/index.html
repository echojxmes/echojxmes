<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>writing — echojxmes</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/assets/logo.png">
<style>
:root{
  --bg:#060608; --orange:#FF5F1F; --orange-bright:#ff8d60; --orange-dim:#b54a20;
  --text:#d9e4ee; --text-dim:#b54a20; --panel-border:#b54a20;
  --glow:0 0 18px #FF5F1F, 0 0 40px #b54a20;
}
*{box-sizing:border-box;}
body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace;
  overflow-x:hidden; position:relative; min-height:100vh; }

body::before{
  content:""; position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(79,178,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,178,255,0.035) 1px, transparent 1px);
  background-size:38px 38px; pointer-events:none; z-index:0;
  animation: gridDrift 40s linear infinite;
}
@keyframes gridDrift{ from{ background-position:0 0, 0 0; } to{ background-position:0 400px, 400px 0; } }
body::after{
  content:""; position:fixed; inset:0;
  background:radial-gradient(ellipse at 50% 20%, rgba(79,178,255,0.10), transparent 60%);
  pointer-events:none; z-index:0;
}

.wrap{ position:relative; z-index:1; max-width:600px; margin:0 auto; padding:60px 24px; }

.nav{
  display:flex; flex-wrap:wrap; gap:22px;
  opacity:0; transform:translateY(-6px);
  animation: navIn 0.6s ease forwards; animation-delay:0.1s;
}
@keyframes navIn{ to{ opacity:1; transform:translateY(0); } }
.nav a{
  font-size:12px; letter-spacing:1.5px; color:var(--text-dim); text-decoration:none;
  padding-bottom:4px; position:relative; transition:color 0.2s ease;
}
.nav a:hover{ color:var(--orange-bright); }
.nav a.active{ color:var(--orange-bright); }
.nav a.active::after{
  content:""; position:absolute; left:0; right:0; bottom:-4px; height:1px;
  background:var(--orange); box-shadow:0 0 6px rgba(79,178,255,0.6);
}
@media (max-width:480px){ .nav{ gap:14px; } .nav a{ font-size:11px; } }

h1{
  color:var(--orange-bright); font-size:18px; letter-spacing:2px; margin-top:34px; margin-bottom:24px;
  text-shadow:var(--glow);
  opacity:0; animation: fadeUp 0.7s ease forwards; animation-delay:0.25s;
}
@keyframes fadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

.post-list{ display:flex; flex-direction:column; gap:12px; }
.post{
  display:flex; justify-content:space-between; align-items:center;
  padding:16px; border:1px solid var(--panel-border); background:rgba(10,13,18,0.8);
  border-radius:8px; text-decoration:none; color:var(--text);
  transition:border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  opacity:0; transform:translateY(14px); animation: cardIn 0.5s ease forwards;
}
.post:nth-child(1){ animation-delay:0.4s; }
.post:nth-child(2){ animation-delay:0.5s; }
.post:nth-child(3){ animation-delay:0.6s; }
.post:nth-child(4){ animation-delay:0.7s; }
@keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }
.post:hover{ border-color:var(--orange); color:var(--orange-bright); transform:translateY(-2px); box-shadow:0 0 16px rgba(79,178,255,0.15); }
.post-date{ font-size:11px; color:var(--text-dim); white-space:nowrap; margin-left:16px; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition:none !important; }
  h1, .nav, .post{ opacity:1; transform:none; }
}
</style></head>
<body>
<div class="wrap">

  <nav class="nav">
    <a href="/">HOME</a>
    <a href="/faq.html">FAQ</a>
    <a href="/changelog.html">CHANGELOG</a>
    <a href="/writing" class="active">BLOGS</a>
    <a href="/contact.html">CONTACT</a>
  </nav>

  <h1>// WRITING</h1>

  <div class="post-list">
    <a class="post" href="/writing/post-1.html"><span>Building my website</span><span class="post-date">JUL 2026</span></a>
  </div>

</div>
</body></html>
