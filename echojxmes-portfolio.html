<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>echojxmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060608;
    --panel:#0b0d12;
    --panel-border:#1c2530;
    --blue:#4fb2ff;
    --blue-bright:#7fd0ff;
    --blue-dim:#1c5b8c;
    --glow:0 0 18px rgba(79,178,255,0.55), 0 0 40px rgba(79,178,255,0.25);
    --text:#d9e4ee;
    --text-dim:#5c6b7a;
    --mono: 'JetBrains Mono', monospace;
    --pixel: 'Press Start 2P', monospace;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    overflow-x:hidden;
    min-height:100%;
  }

  body{
    position:relative;
  }

  /* ambient scanlines + grid */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(79,178,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,178,255,0.035) 1px, transparent 1px);
    background-size:38px 38px;
    pointer-events:none;
    z-index:0;
    animation: gridDrift 40s linear infinite;
  }

  @keyframes gridDrift{
    from{ background-position:0 0, 0 0; }
    to{ background-position:0 400px, 400px 0; }
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at 50% 20%, rgba(79,178,255,0.10), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:56px 24px 80px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* breadcrumb */
  .crumb{
    font-size:13px;
    letter-spacing:0.5px;
    color:var(--text-dim);
    display:flex;
    gap:8px;
    opacity:0;
    transform:translateY(-6px);
    animation: fadeDown 0.6s ease forwards;
    animation-delay:0.1s;
  }
  .crumb .tilde{ color:var(--blue); text-shadow:var(--glow); }
  .crumb .sep{ color:#33414f; }
  .crumb .home{ color:var(--blue-bright); }

  @keyframes fadeDown{
    to{ opacity:1; transform:translateY(0); }
  }

  /* status badge with typing text */
  .badge{
    margin-top:34px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:9px 16px;
    border:1px solid var(--panel-border);
    background:rgba(10,14,20,0.7);
    border-radius:6px;
    font-size:13px;
    color:#a9b8c6;
    opacity:0;
    animation: fadeUp 0.6s ease forwards;
    animation-delay:0.35s;
    min-height:20px;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--blue);
    box-shadow:var(--glow);
    animation: pulse 1.6s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.5; transform:scale(0.8); }
  }

  #typedText{
    white-space:nowrap;
    overflow:hidden;
  }
  .cursor{
    display:inline-block;
    width:2px;
    background:var(--blue-bright);
    margin-left:2px;
    animation: blink 0.85s steps(1) infinite;
    box-shadow:0 0 6px rgba(79,178,255,0.8);
  }
  @keyframes blink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:0; }
  }

  /* logo */
  .logo{
    margin-top:26px;
    text-align:center;
    line-height:0.95;
  }
  .logo-line{
    font-family:var(--pixel);
    font-size:clamp(38px, 9vw, 74px);
    color:#fff;
    text-shadow:
      0 0 6px rgba(79,178,255,0.9),
      0 0 22px rgba(79,178,255,0.65),
      0 0 55px rgba(79,178,255,0.35);
    letter-spacing:2px;
    opacity:0;
    transform:translateY(-140px) rotate(-2deg);
    filter:blur(2px);
    position:relative;
  }
  .logo-line.fall{
    animation: fallIn 0.85s cubic-bezier(.25,.9,.4,1.25) forwards;
  }
  .logo-line:nth-child(1){ animation-delay:0.75s; }
  .logo-line:nth-child(2){ animation-delay:1.05s; }

  @keyframes fallIn{
    0%{ opacity:0; transform:translateY(-140px) rotate(-2deg); filter:blur(3px); }
    60%{ opacity:1; transform:translateY(6px) rotate(0.5deg); filter:blur(0); }
    80%{ transform:translateY(-3px); }
    100%{ opacity:1; transform:translateY(0) rotate(0deg); filter:blur(0); }
  }

  /* glitch flicker after landing */
  .logo-line.glitch::before,
  .logo-line.glitch::after{
    content:attr(data-text);
    position:absolute;
    left:0; top:0; right:0;
    opacity:0;
  }
  .logo-line.glitch::before{
    color:#ff4fd8;
    animation: glitchTop 4.5s infinite;
    mix-blend-mode:screen;
  }
  .logo-line.glitch::after{
    color:#4fffe0;
    animation: glitchBot 4.5s infinite;
    mix-blend-mode:screen;
  }
  @keyframes glitchTop{
    0%,93%,100%{ opacity:0; transform:translate(0,0); }
    94%{ opacity:0.7; transform:translate(-2px,-1px); }
    96%{ opacity:0.5; transform:translate(2px,1px); }
  }
  @keyframes glitchBot{
    0%,90%,100%{ opacity:0; transform:translate(0,0); }
    91%{ opacity:0.6; transform:translate(2px,1px); }
    93%{ opacity:0.4; transform:translate(-2px,0); }
  }

  .tagline{
    margin-top:20px;
    font-size:12.5px;
    letter-spacing:1.5px;
    color:var(--text-dim);
    text-transform:uppercase;
    opacity:0;
    animation: fadeUp 0.7s ease forwards;
    animation-delay:1.5s;
  }
  .tagline .slash{ color:var(--blue); }

  /* links */
  .links{
    margin-top:38px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .card{
    --d:0s;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px;
    border:1px solid var(--panel-border);
    background:linear-gradient(180deg, rgba(14,18,24,0.9), rgba(8,10,14,0.9));
    border-radius:8px;
    text-decoration:none;
    color:var(--text);
    position:relative;
    overflow:hidden;
    opacity:0;
    transform:translateY(16px);
    animation: cardIn 0.6s ease forwards;
    animation-delay: calc(1.7s + var(--d));
    transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }
  @keyframes cardIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(100deg, transparent, rgba(79,178,255,0.12), transparent);
    transform:translateX(-120%);
    transition:none;
  }
  .card:hover::before{
    animation: sheen 0.8s ease forwards;
  }
  @keyframes sheen{
    to{ transform:translateX(120%); }
  }

  .card:hover{
    border-color:var(--blue-dim);
    transform:translateY(-2px);
    box-shadow:0 6px 24px rgba(79,178,255,0.12);
  }

  .card:nth-child(1){ --d:0s; }
  .card:nth-child(2){ --d:0.1s; }
  .card:nth-child(3){ --d:0.2s; }
  .card:nth-child(4){ --d:0.3s; }

  .card-left{
    display:flex;
    align-items:center;
    gap:14px;
    font-weight:700;
    font-size:15px;
  }
  .card-left svg{
    width:20px;
    height:20px;
    stroke:var(--blue-bright);
    flex-shrink:0;
    filter:drop-shadow(0 0 5px rgba(79,178,255,0.6));
  }
  .arrow{
    color:var(--text-dim);
    transition:transform 0.25s ease, color 0.25s ease;
  }
  .card:hover .arrow{
    transform:translateX(4px);
    color:var(--blue-bright);
  }

  .footer{
    margin-top:64px;
    width:100%;
    text-align:center;
    opacity:0;
    animation: fadeUp 0.7s ease forwards;
    animation-delay:2.3s;
  }
  .footer .label{
    font-size:11px;
    letter-spacing:3px;
    color:#2c3742;
  }
  .footer .rule{
    height:1px;
    width:100%;
    background:linear-gradient(90deg, transparent, var(--panel-border), transparent);
    margin-bottom:14px;
  }

  @media (max-width:480px){
    .logo-line{ letter-spacing:1px; }
    .card{ padding:15px 16px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition:none !important; }
    .logo-line{ opacity:1; transform:none; filter:none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="crumb">
    <span class="tilde">~</span><span class="sep">/</span><span class="home">home</span>
  </div>

  <div class="badge">
    <span class="dot"></span>
    <span id="typedText"></span><span class="cursor" id="cursorEl"></span>
  </div>

  <div class="logo">
    <div class="logo-line fall glitch" data-text="ECHO">ECHO</div>
    <div class="logo-line fall glitch" data-text="JXMES">JXMES</div>
  </div>

  <div class="tagline"><span class="slash">//</span> MAKING THINGS BREAK, THEN FIXING THEM ON CAMERA</div>

  <div class="links">
    <a class="card" href="#" target="_blank" rel="noopener">
      <span class="card-left">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        TikTok
      </span>
      <span class="arrow">&#8594;</span>
    </a>

    <a class="card" href="#" target="_blank" rel="noopener">
      <span class="card-left">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><polygon points="10,9 16,12 10,15"/></svg>
        YouTube
      </span>
      <span class="arrow">&#8594;</span>
    </a>

    <a class="card" href="#" target="_blank" rel="noopener">
      <span class="card-left">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Discord
      </span>
      <span class="arrow">&#8594;</span>
    </a>

    <a class="card" href="#" target="_blank" rel="noopener">
      <span class="card-left">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
        Business Inquiries
      </span>
      <span class="arrow">&#8594;</span>
    </a>
  </div>

  <div class="footer">
    <div class="rule"></div>
    <div class="label">MY SETUP</div>
  </div>

</div>

<script>
  const phrases = [
    "debugging reality",
    "shipping bugs as features",
    "compiling chaos",
    "online rn",
    "making content, breaking things"
  ];

  const el = document.getElementById('typedText');
  const cursor = document.getElementById('cursorEl');
  cursor.style.height = "1em";

  let phraseIndex = 0;
  let charIndex = 0;
  let deleting = false;

  function tick(){
    const current = phrases[phraseIndex];

    if(!deleting){
      charIndex++;
      el.textContent = current.slice(0, charIndex);
      if(charIndex === current.length){
        deleting = true;
        setTimeout(tick, 1400);
        return;
      }
      setTimeout(tick, 55 + Math.random()*40);
    } else {
      charIndex--;
      el.textContent = current.slice(0, charIndex);
      if(charIndex === 0){
        deleting = false;
        phraseIndex = (phraseIndex + 1) % phrases.length;
        setTimeout(tick, 300);
        return;
      }
      setTimeout(tick, 28);
    }
  }

  // start typing after the intro badge fades in
  setTimeout(tick, 700);
</script>

</body>
</html>
