<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>changelog</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060608; --blue:#4fb2ff; --blue-bright:#7fd0ff; --blue-dim:#1c5b8c;
  --text:#d9e4ee; --text-dim:#5c6b7a; --panel-border:#1c2530;
  --glow:0 0 18px rgba(79,178,255,0.55), 0 0 40px rgba(79,178,255,0.25);
}
*{box-sizing:border-box;}
body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace;
  overflow-x:hidden; position:relative; min-height:100vh; }

body::before{
  content:""; position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(79,178,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,178,255,0.035) 1px, transparent 1px);
  background-size:38px 38px; pointer-events:none; z-index:0;
  animation: gridDrift 40s linear infinite;
}
@keyframes gridDrift{ from{ background-position:0 0, 0 0; } to{ background-position:0 400px, 400px 0; } }
body::after{
  content:""; position:fixed; inset:0;
  background:radial-gradient(ellipse at 50% 20%, rgba(79,178,255,0.10), transparent 60%);
  pointer-events:none; z-index:0;
}

.wrapper{ position:relative; z-index:1; max-width:600px; margin:0 auto; padding:60px 24px; }

.nav{
  display:flex; flex-wrap:wrap; gap:22px;
  opacity:0; transform:translateY(-6px);
  animation: navIn 0.6s ease forwards; animation-delay:0.1s;
}
@keyframes navIn{ to{ opacity:1; transform:translateY(0); } }
.nav a{
  font-size:12px; letter-spacing:1.5px; color:var(--text-dim); text-decoration:none;
  padding-bottom:4px; position:relative; transition:color 0.2s ease;
}
.nav a:hover{ color:var(--blue-bright); }
.nav a.active{ color:var(--blue-bright); }
.nav a.active::after{
  content:""; position:absolute; left:0; right:0; bottom:-4px; height:1px;
  background:var(--blue); box-shadow:0 0 6px rgba(79,178,255,0.6);
}
@media (max-width:480px){ .nav{ gap:14px; } .nav a{ font-size:11px; } }

h1{
  color:var(--blue-bright); font-size:18px; letter-spacing:2px; margin-top:34px;
  text-shadow:var(--glow);
  opacity:0; animation: fadeUp 0.7s ease forwards; animation-delay:0.25s;
}
@keyframes fadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

.entry{ border-left:2px solid var(--panel-border); padding-left:16px; margin-bottom:22px; margin-top:24px; }
.date{ color:var(--text-dim); font-size:11px; letter-spacing:1px; }
.desc{ font-size:13px; margin-top:4px; }
a{ color:var(--blue-bright); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition:none !important; }
  h1, .nav{ opacity:1; transform:none; }
}
</style></head>
<body>
<div class="wrapper">

  <nav class="nav">
    <a href="/">HOME</a>
    <a href="/faq.html">FAQ</a>
    <a href="/changelog.html" class="active">CHANGELOG</a>
    <a href="/writing">BLOGS</a>
    <a href="/contact.html">CONTACT</a>
    <a href="/resume.html">RESUME</a>
  </nav>

  <h1>// CHANGELOG</h1>

  <div class="entry"><div class="date">2026-07-25</div><div class="desc">Added live GitHub project feed, FAQ, and rates section</div></div>
  <div class="entry"><div class="date">2026-07-25</div><div class="desc">Added self-hosted uptime tracking</div></div>
  <div class="entry"><div class="date">2026-07-25</div><div class="desc">Launched site — links, gear setup, bio</div></div>

</div>
</body></html>
